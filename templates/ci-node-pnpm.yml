# CI for a Node and pnpm repository, from gaidin's. Copy it to .github/workflows/ci.yml. tower's main ruleset requires
# the job named check by name, so keep the name.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch or pull request replaces the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # The version comes from packageManager in package.json.
      - uses: pnpm/action-setup@v6
        with:
          cache: true

      # The oldest Node line the repository supports.
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - run: pnpm install --frozen-lockfile

      # Install here whatever the tests need so none skip: system packages, browsers
      # (pnpm exec playwright install --with-deps chromium), services.

      - name: Check
        shell: bash
        run: pnpm check 2>&1 | tee check.log

      # A test that skips itself when something can't start makes a broken runner look green. This matches node:test's
      # summary; change it for another test runner.
      - name: No tests skipped
        run: grep -Eqx '(# |ℹ )skipped 0' check.log
